name: Build desktop installers

# Builds the Windows .exe, macOS .dmg, and Linux AppImage/.deb and attaches
# them to a GitHub Release whenever a version tag (v1.2.3) is pushed.
# Manual runs (workflow_dispatch) build everything and store the installers
# as workflow artifacts without creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows-installer
          - os: macos-latest
            script: dist:mac
            artifact: macos-installer
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux-installers

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # The macOS build ships unsigned (no Apple Developer certificate);
          # users open it with right-click -> Open the first time.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          fail_on_unmatched_files: false
